<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check an offer | TrustKazi</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h2>Check an offer</h2>
    <p>Paste a job ad, message or email below. TrustKazi looks for common scam warning signs and explains each one. Your text is checked in your browser and is not sent anywhere.</p>

    <label for="offer-text">Offer text</label>
    <textarea id="offer-text" rows="10" maxlength="5000" placeholder="Paste the offer here..."></textarea>

    <div class="actions">
      <button id="check-button" type="button" class="button">Check offer</button>
      <button id="clear-button" type="button" class="button secondary">Clear</button>
    </div>

    <div id="check-result" aria-live="polite"></div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/scamEngine.js"></script>
  <script src="js/check.js"></script>
</body>
</html>
